<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks — Komputernerd</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <style>
    :root { --bg:#fbfbf9; --fg:#111; --muted:#6b6b6b; --logo-invert:0; }
    @media (prefers-color-scheme: dark){ :root{ --bg:#0d0d0d; --fg:#f2f2f0; --muted:#9a9a9a; --logo-invert:1; } }
    * { box-sizing:border-box; }
    body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--fg); text-align:center; padding:2rem;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    img{ width:170px; height:auto; filter:invert(var(--logo-invert)); }
    h1{ font-size:1.4rem; margin:1.5rem 0 0.5rem; }
    p{ color:var(--muted); margin:0 0 1.5rem; }
    a{ color:inherit; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo.png" alt="Komputernerd" />
    <h1>Thanks — message received.</h1>
    <p>I'll get back to you shortly.</p>
    <a href="/">&larr; Back to komputernerd.com</a>
  </main>
</body>
</html>
